{% extends "base.html" %}

{% block title %}
Disponibilità
{% endblock %}

{% block content %}

<h1>Slot Disponibili</h1>

<h3>Data: {{ booking_date }}</h3>

<ul>
  {% for slot in slots %}
    <li>
      <a href="/book?booking_date={{ booking_date }}&booking_time={{ slot }}&treatment_id={{ treatment_id }}">
        {{ slot }}
      </a>
    </li>
  {% endfor %}
</ul>

{% endblock %}
