{% extends "base.html" %}

{% block title %}
Disponibilità
{% endblock %}

{% block content %}

<div class="availability-section">

  <h1>Slot Disponibili</h1>
  <h3 class="selected-date">Data selezionata: {{ booking_date }}</h3>

  <div class="slots-container">
    {% for slot in slots %}
        <a class="slot-card" href="/book?booking_date={{ booking_date }}&booking_time={{ slot }}&treatment_id={{ treatment_id }}">
          <span class="slot-time">{{ slot }}</span>
          <span class="slot-action">Prenota</span>
        </a>
    {% endfor %}
  </div>

</div>

{% endblock %}
