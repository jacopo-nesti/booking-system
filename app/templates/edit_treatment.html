{% extends "base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="title-create">
       <h1>Dashboard Admin</h1>

       <h2>Modifica un trattamento</h2>
</div>

<div class="create-treatment-container">
       <form method="POST">

                     <p>Modifica il nome del trattamento</p>
                     <input type="text"
                            name="service_name"
                            value="{{ treatment.service_name }}"
                            required>
                     
                     <p>Modifica la durata del trattamento</p>
                     <input type="number"
                            name="duration_min"
                            value="{{ treatment.duration_min }}"
                            required>

                     <p>Modifica il prezzo del trattamento</p>
                     <input type="number"
                            step="0.01"
                            name="price"
                            value="{{ treatment.price }}"
                            required>

                     <p>Modifica la categoria del trattamento</p>
                     <input type="text"
                            name="category"
                            value="{{ treatment.category }}"
                            required>

                     <button class="btn-selection-create" type="submit" onclick="alert('Trattamento aggiornato con successo')">
                            Aggiorna
                     </button>

       </form>
</div> 

{% endblock %}
