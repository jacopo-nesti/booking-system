{% extends "base.html" %}

{% block content %}

<div class="title-edit-create">
       <h1>Modifica trattamento</h1>
</div>

<div class="edit-treatment-container">
       <form method="POST">

              <div class="edit-treatment-card">
                     <input type="text"
                            name="service_name"
                            value="{{ treatment.service_name }}"
                            required>

                     <input type="number"
                            name="duration_min"
                            value="{{ treatment.duration_min }}"
                            required>

                     <input type="number"
                            step="0.01"
                            name="price"
                            value="{{ treatment.price }}"
                            required>

                     <input type="text"
                            name="category"
                            value="{{ treatment.category }}"
                            required>

                     <button type="submit" onclick="alert('Trattamento aggiornato con successo')">
                            Aggiorna
                     </button>
              </div>

       </form>
</div> 

{% endblock %}
