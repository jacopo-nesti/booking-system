{% extends "base.html" %}

{% block content %}

<h1>Modifica trattamento</h1>

<form method="POST">

    <input type="text"
           name="service_name"
           value="{{ treatment.service_name }}"
           required>

    <input type="number"
           name="duration_min"
           value="{{ treatment.duration_min }}"
           required>

    <input type="number"
           step="0.01"
           name="price"
           value="{{ treatment.price }}"
           required>

    <input type="text"
           name="category"
           value="{{ treatment.category }}"
           required>

    <button type="submit">
        Aggiorna
    </button>

</form>

{% endblock %}
